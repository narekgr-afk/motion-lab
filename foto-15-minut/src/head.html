<head>

<title>Фото на документы за 15 минут</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a17; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  ФОТО ЗА 15 МИНУТ — 9:16, 15.0s @ 120 BPM, 24fps, riso. Завтра сдавать документы, а фото нет → без записи или по селфи →
//  таймер 15 минут и принтер → готово. Факты только с лендингов студии (data/photo-docs-landings.ts).
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 15.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const PRINTF = '"Arial Black", "Helvetica Neue", "Franklin Gothic Heavy", Impact, "DejaVu Sans", "Liberation Sans", sans-serif';
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive';
const CX = 470;

const ERA_LIST = [[0, 3.75, () => sceneNight()], [3.75, 7.5, () => sceneStudio()], [7.5, 11.25, () => scenePrint()], [11.25, 15, () => sceneDone()]];
const SHOTS = [
  ['night',  0, 0.0, 3.75, 'вечер: сдавать завтра, а фото нет'],
  ['studio', 1, 3.75, 7.5, 'без записи или по селфи: вспышка'],
  ['print',  2, 7.5, 11.25, 'таймер 15 минут, принтер выдаёт фото'],
  ['done',   3, 11.25, 15.0, 'готово: фото в руках, адрес'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.75, 7.5, 11.25],
  cues: { panic: 0.6, wave: 4.5, flash: 5.5, selfie: 6.4, p1: 8.4, p2: 9.0, p3: 9.6, hop: 11.75, card: 12.5 },
  acts: [
    { name: '1 Вечер', role: 'problem', t0: 0.0, t1: 3.75 },
    { name: '2 Студия', role: 'turn', t0: 3.75, t1: 7.5 },
    { name: '3 Принтер', role: 'build', t0: 7.5, t1: 11.25 },
    { name: '4 Готово', role: 'payoff', t0: 11.25, t1: 15.0 },
  ],
  board: [
    { t: 3.0, title: 'сдавать завтра, а фото нет', sound: 'тик часов', next: 'часы → объектив' },
    { t: 6.2, title: 'без записи, вспышка, или по селфи', sound: 'щелчок затвора', next: 'объектив → таймер' },
    { t: 10.2, title: 'принтер выдаёт фото', sound: 'шипение печати, щелчки', next: 'таймер → герой' },
    { t: 14.0, title: 'готово, адрес', sound: 'аккорд и затухание', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
